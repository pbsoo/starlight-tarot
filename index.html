function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const spotlight=document.createElement('dialog');
spotlight.className='spotlight';
spotlight.setAttribute('aria-label','선택한 카드 · 다시 누르면 원래 자리로 돌아갑니다');
document.body.append(spotlight);
let activeCard=null;
function finishClose(){
  if(!activeCard)return;
  const {source,overflow,timer}=activeCard;
  clearTimeout(timer);
  spotlight.close();
  spotlight.replaceChildren();
  source.style.visibility='';
  source.setAttribute('aria-pressed','false');
  document.documentElement.style.overflow=overflow;
  activeCard=null;
  source.focus({preventScroll:true});
  status.textContent='다른 카드에도 작은 문장이 기다리고 있어요.';
}
function closeCard(){
  if(!activeCard||activeCard.closing)return;
  activeCard.closing=true;
  const {floating}=activeCard;
  floating.classList.remove('flipped');
  floating.style.transform='translate(0px,0px) scale(1)';
  floating.setAttribute('aria-pressed','false');
  floating.addEventListener('transitionend',event=>{
    if(event.target===floating&&event.propertyName==='transform')finishClose();
  });
  activeCard.timer=setTimeout(finishClose,matchMedia('(prefers-reduced-motion:reduce)').matches?0:850);
}
function openCard(source,message){
  if(activeCard)return;
  const overflow=document.documentElement.style.overflow;
  document.documentElement.style.overflow='hidden';
  const rect=source.getBoundingClientRect();
  const floating=source.cloneNode(true);
  floating.style.setProperty('--reading-unit',(rect.width/310)+'px');
  floating.classList.remove('flipped');
  Object.assign(floating.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',transform:'translate(0px,0px) scale(1)'});
  floating.setAttribute('aria-label',message.title+'. '+message.text.replaceAll('\n',' ')+' 다시 누르면 원래 자리로 돌아갑니다.');
  floating.setAttribute('aria-pressed','true');
  floating.querySelector('.front').setAttribute('aria-hidden','false');
  floating.addEventListener('click',closeCard);
  spotlight.append(floating);
  activeCard={source,floating,overflow,closing:false,timer:null};
  source.style.visibility='hidden';
  source.setAttribute('aria-pressed','true');
  spotlight.showModal();
  floating.focus({preventScroll:true});
  const viewport=window.visualViewport;
  const width=viewport?viewport.width:window.innerWidth;
  const height=viewport?viewport.height:window.innerHeight;
  const left=viewport?viewport.offsetLeft:0;
  const top=viewport?viewport.offsetTop:0;
  const scale=Math.min(310/rect.width,(width-48)/rect.width,(height-80)/rect.height);
  const dx=left+width/2-(rect.left+rect.width/2);
  const dy=top+height/2-(rect.top+rect.height/2);
  floating.getBoundingClientRect();
  requestAnimationFrame(()=>{
    if(!activeCard||activeCard.closing)return;
    floating.style.transform='translate('+dx+'px,'+dy+'px) scale('+scale+')';
    floating.classList.add('flipped');
  });
  status.textContent='당신이 고른 문장 · '+message.title+' — 다시 누르면 원래 자리로 돌아가요.';
}
spotlight.addEventListener('cancel',event=>{event.preventDefault();closeCard()});
spotlight.addEventListener('click',event=>{if(event.target===spotlight)closeCard()});

const card=document.createElement('button');card.type='button';card.className='card';
card.setAttribute('aria-label',(fixed?'고정 ':'랜덤 ')+(i+1)+'번째 카드 뒤집기');card.setAttribute('aria-pressed','false');
card.innerHTML='<span class="inner"><span class="face back">'+ornament+'</span><span class="face front" aria-hidden="true"><span class="symbol">'+message.symbol+'</span><span class="english">'+message.en+'</span><h2>'+message.title+'</h2><span class="message">'+message.text.replaceAll('\n','<br>')+'</span><span class="tiny">✦</span></span></span>';
card.addEventListener('click',()=>openCard(card,message));
const number=document.createElement('span');number.className='number';number.textContent=fixed?['I','II','III'][i]:String(i+1).padStart(2,'0');
wrap.append(card,number);container.append(wrap);
}
function deal(){deck.replaceChildren();shuffle(messages.slice(3)).slice(0,16).forEach((message,i)=>buildCard(message,i,deck))}
messages.slice(0,3).forEach((message,i)=>buildCard(message,i,document.getElementById('fixed-cards'),true));
document.getElementById('shuffle').addEventListener('click',()=>{deal();status.textContent='카드를 새로 섞었어요. 다시 마음이 가는 한 장을 골라보세요.'});deal();
</script>
