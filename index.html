const fixedCards=[{"title":"첫 번째 편지","en":"HAPPY BIRTHDAY","symbol":"✦","text":"9월초에 알게 된 새벽이\n어느덧 두달이~\n\n송편 줍줍하면서 단톡방이 만들어지고 하루하루 굿모닝 인사하며 다같이 가까워졌지\n\n이거 저거 만들어주는걸 좋아하는 새벽\n그덕에 예쁜것들 받아보고 방송에 도움주고 감사링\n\n유산균생 제주막걸리 내생에 먹어볼수\n없었을 수도 있는데 덕분에 먹어보고\n기분이가 좋다 취한다 땡큐링\n\n방송 잘되길 바라고 남캠 가즈아\n그리구 건강 챙기고, 하고자하는 거\n다 잘되길 바랄께\n\n새벽이 생일 마니마니 축하해","image":"fixed-1.png","letter":true},{"title":"두 번째 편지","en":"HAPPY BIRTHDAY","symbol":"✦","text":"늘 건강하고, 네가 선택한 길에서 좋은 일들이 많이 생겼으면 좋겠다.\n다만 하나 걱정인 거는 뭐든 빠르게 빠르게 \n진행하니 앞으로 조금은 천천히 단단하게 \n진행했으면 좋겠어\n살다 보면 힘든 날도 있고, 생각대로 잘 풀리지 않을 때도 있겠지만\n그런 시간들도 지나고 나면 결국 웃으면서 이야기할 날이 오듯\n그러니까 너무 걱정하지 말고, 네가 하고 싶은 것들 하나씩 해나가면서\n지금처럼 네 삶 잘 만들어갔으면 좋겠다.\n언제나 너의 선택을 존중하며 지자가 되어볼게 생일축한다 ","image":"fixed-2.jpeg","letter":true},{"title":"세 번째 편지","en":"HAPPY BIRTHDAY","symbol":"✦","text":"아직은 말을 쉽게 하지 못하는 사이지만 어느덧 시간이 지났네요. \n새벽씨 생일 정말 축하해요! 말로는 다 표현할 수 없지만 새벽씨가 가는길을 늘 응원하고 있어요.\n하루하루 바빠 많은 이야기를 듣지 못하고 전하지 못했지만 언젠가는 또다시 깊은 이야기를 할 수 있길 빌어요. \n짧은 인연이 아닌 오래되어 편하고 믿을 수 있는 인연이 되길 바라요.\n다시한번 생일 축하합니다.","image":"fixed-3.jpeg","letter":true}];
const memoryImages=["memory-01.png","memory-02.png","memory-03.png","memory-04.jpeg","memory-05.jpeg","memory-06.png","memory-07.jpeg","memory-08.jpeg","memory-09.jpeg"];
const deck=document.getElementById('cards');
const status=document.getElementById('status');
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const spotlight=document.createElement('dialog');
spotlight.className='spotlight';
spotlight.setAttribute('aria-label','선택한 카드 · 다시 누르면 원래 자리로 돌아갑니다');
document.body.append(spotlight);
let activeCard=null;
function finishClose(){
  if(!activeCard)return;
  const {source,overflow,timer}=activeCard;
  clearTimeout(timer);
  spotlight.close();
  spotlight.replaceChildren();
  source.style.visibility='';
  source.setAttribute('aria-pressed','false');
  document.documentElement.style.overflow=overflow;
  activeCard=null;
  source.focus({preventScroll:true});
  status.textContent='다른 카드에도 작은 문장이 기다리고 있어요.';
}
function closeCard(){
  if(!activeCard||activeCard.closing)return;
  activeCard.closing=true;
  const {floating,restTransform}=activeCard;
  floating.classList.remove('flipped');
  floating.style.transform=restTransform;
  floating.setAttribute('aria-pressed','false');
  floating.addEventListener('transitionend',event=>{
    if(event.target===floating&&event.propertyName==='transform')finishClose();
  });
  activeCard.timer=setTimeout(finishClose,matchMedia('(prefers-reduced-motion:reduce)').matches?0:850);
}
function openCard(source,message){
 if(activeCard)return;
 const overflow=document.documentElement.style.overflow;
 document.documentElement.style.overflow='hidden';
 const rect=source.getBoundingClientRect();
 const viewport=window.visualViewport;
 const width=viewport?viewport.width:innerWidth;
 const height=viewport?viewport.height:innerHeight;
 const offsetX=viewport?viewport.offsetLeft:0,offsetY=viewport?viewport.offsetTop:0;
 const targetWidth=Math.min(message.letter?430:310,width-32);
 const targetHeight=Math.min(message.letter?720:targetWidth/.68,height-40);
 const floating=source.cloneNode(true);
 const restTransform='translate(0px,0px) scale('+rect.width/targetWidth+','+rect.height/targetHeight+')';
 Object.assign(floating.style,{left:rect.left+'px',top:rect.top+'px',width:targetWidth+'px',height:targetHeight+'px',transform:restTransform});
 floating.style.setProperty('--reading-unit','1px');
 floating.setAttribute('aria-label',message.title+' · 다시 누르면 원래 자리로 돌아갑니다.');
 floating.setAttribute('aria-pressed','true');
 floating.querySelector('.front').setAttribute('aria-hidden','false');
 const reading=floating.querySelector('.message');
 if(message.letter){reading.tabIndex=0;reading.setAttribute('role','region');reading.setAttribute('aria-label','생일 편지 전문 · 스크롤해서 읽기');reading.addEventListener('keydown',event=>event.stopPropagation())}
 let pointerStart=null;
 floating.addEventListener('pointerdown',event=>{pointerStart={x:event.clientX,y:event.clientY,scroll:reading.scrollTop}});
 floating.addEventListener('click',event=>{
  if(window.getSelection().toString())return;
  if(pointerStart&&(Math.abs(event.clientX-pointerStart.x)>8||Math.abs(event.clientY-pointerStart.y)>8||Math.abs(reading.scrollTop-pointerStart.scroll)>3))return;
  closeCard();
 });
 spotlight.append(floating);
 activeCard={source,floating,overflow,restTransform,closing:false,timer:null};
 source.style.visibility='hidden';source.setAttribute('aria-pressed','true');
 spotlight.showModal();floating.focus({preventScroll:true});
 const dx=offsetX+(width-targetWidth)/2-rect.left;
 const dy=offsetY+(height-targetHeight)/2-rect.top;
 floating.getBoundingClientRect();
 requestAnimationFrame(()=>{if(!activeCard||activeCard.closing)return;floating.style.transform='translate('+dx+'px,'+dy+'px) scale(1)';floating.classList.add('flipped')});
 status.textContent='당신이 고른 문장 · '+message.title+' — 다시 누르면 원래 자리로 돌아가요.';
}
spotlight.addEventListener('cancel',event=>{event.preventDefault();closeCard()});
spotlight.addEventListener('click',event=>{if(event.target===spotlight)closeCard()});
window.addEventListener('resize',finishClose);

function buildCard(message,i,container,fixed=false){
 const wrap=document.createElement('div');wrap.className='card-wrap';
 const card=document.createElement('button');card.type='button';card.className='card'+(fixed?' letter-card':'');
 card.setAttribute('aria-label',(fixed?'고정 ':'랜덤 ')+(i+1)+'번째 카드 뒤집기');card.setAttribute('aria-pressed','false');
 card.innerHTML='<span class="inner"><span class="face back photo"><img alt="" loading="'+(fixed?'eager':'lazy')+'" decoding="async"></span><span class="face front'+(message.letter?' letter-front':'')+'" aria-hidden="true"><span class="english"></span><h2></h2><span class="message"></span><span class="tiny">✦</span><span class="reading-hint"></span></span></span>';
 card.querySelector('img').src=message.image;
 card.querySelector('.english').textContent=message.en;
 card.querySelector('h2').textContent=message.title;
 card.querySelector('.message').textContent=message.text;
 card.querySelector('.reading-hint').textContent=message.letter?'스크롤해서 읽기 · 다시 누르면 돌아가요':'';
 card.addEventListener('click',()=>openCard(card,message));
 const number=document.createElement('span');number.className='number';number.textContent=fixed?['I','II','III'][i]:String(i+1).padStart(2,'0');
 wrap.append(card,number);container.append(wrap);
}
function deal(){
 deck.replaceChildren();let images=shuffle(memoryImages);while(images.length<16)images.push(...shuffle(memoryImages));
 shuffle(messages.slice(3)).slice(0,16).forEach((message,i)=>buildCard({...message,image:images[i]},i,deck));
}
fixedCards.forEach((message,i)=>buildCard(message,i,document.getElementById('fixed-cards'),true));
document.getElementById('shuffle').addEventListener('click',()=>{deal();status.textContent='카드를 새로 섞었어요. 다시 마음이 가는 한 장을 골라보세요.'});deal();
</script>
