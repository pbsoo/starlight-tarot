<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#201c31"><meta name="description" content="잠시 마음을 고르고, 당신을 위한 작은 문장을 만나보세요. 별빛 아래 펼쳐진 여섯 장의 카드.">
<title>별빛 한 장 · 오늘의 작은 문장</title>
<style>
*{box-sizing:border-box} :root{color-scheme:dark;--gold:#d8bc82;--ink:#f4eee3;--muted:#afa7bd}body{margin:0;min-height:100svh;background:#181622;color:var(--ink);font-family:ui-serif,'Apple SD Gothic Neo','Malgun Gothic',serif;background-image:radial-gradient(ellipse at 50% 15%,#42355270,transparent 55%),radial-gradient(ellipse at 90% 80%,#46323640,transparent 45%)}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.38;background-image:radial-gradient(1px 1px at 14% 16%,#fff 90%,transparent),radial-gradient(1px 1px at 79% 25%,#fff 90%,transparent),radial-gradient(1px 1px at 32% 75%,#d8bc82 90%,transparent),radial-gradient(1px 1px at 87% 83%,#fff 90%,transparent);background-size:290px 270px,430px 390px,350px 330px,520px 470px}header,main,footer{position:relative}header{max-width:1240px;margin:auto;padding:28px 36px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d8bc821f}.brand{font-size:17px;letter-spacing:3px;color:var(--gold)}.brand span{font-size:25px;margin-right:9px}.header-note{font-size:11px;letter-spacing:3px;color:var(--muted)}main{max-width:1160px;margin:auto;padding:49px 30px 38px;text-align:center}.eyebrow{font-size:10px;letter-spacing:5px;color:var(--gold);margin:0 0 15px}.moon{display:block;color:var(--gold);font-size:34px;line-height:1;margin-bottom:15px}h1{font-weight:400;font-size:clamp(29px,4.7vw,46px);letter-spacing:-1.7px;line-height:1.4;margin:0 0 15px}h1 em{color:var(--gold);font-style:normal}.intro{font-family:ui-sans-serif,'Apple SD Gothic Neo',sans-serif;font-size:13px;line-height:1.9;color:var(--muted);margin:0}.divider{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--gold);font-size:12px;margin:27px 0 29px}.divider:before,.divider:after{content:'';width:70px;height:1px;background:linear-gradient(90deg,transparent,#d8bc825f)}.divider:after{transform:rotate(180deg)}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:17px;align-items:start}.card-wrap{min-width:0}.card{display:block;position:relative;width:100%;aspect-ratio: .59;border:0;background:transparent;padding:0;perspective:1000px;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.65,.25,1)}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border:1px solid #b9a17099;border-radius:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}.back{background:linear-gradient(145deg,#393049,#242033);padding:9px;box-shadow:0 14px 35px #0004;transition:box-shadow .3s,border-color .3s}.back:before{content:'';position:absolute;inset:6px;border:1px solid #d8bc8255;border-radius:5px}.back svg{height:100%;width:100%;color:var(--gold)}.card:hover .back{box-shadow:0 14px 40px #d8bc821f;border-color:var(--gold)}.card:focus-visible{outline:2px solid var(--gold);outline-offset:7px;border-radius:9px}.front{transform:rotateY(180deg);background:linear-gradient(155deg,#f8f0e2,#e7dac5);color:#45384e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 13px;border-color:#dfc89c}.front:before{content:'';position:absolute;inset:7px;border:1px solid #a98a595c;border-radius:4px;pointer-events:none}.front .symbol{font-size:37px;line-height:1.1;color:#9a784b;margin-bottom:18px}.front .english{font-size:8px;letter-spacing:2px;color:#8d765d;margin:0 0 9px}.front h2{font-size:19px;font-weight:400;margin:0 0 16px}.front .message{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;line-height:1.95;word-break:keep-all;margin:0}.front .tiny{color:#a1875e;font-size:14px;margin-top:18px}.number{display:block;margin-top:15px;font-size:10px;letter-spacing:3px;color:#9f94ad}.controls{margin-top:28px}.shuffle{border:1px solid #d8bc8260;border-radius:30px;padding:12px 25px;background:transparent;color:#e1cba4;font-family:inherit;font-size:12px;cursor:pointer;transition:background .2s}.shuffle:hover{background:#d8bc8214}.shuffle:focus-visible{outline:2px solid var(--gold);outline-offset:4px}.hint{font-family:'Apple SD Gothic Neo',sans-serif;font-size:11px;color:#91869f;margin:18px 0 0;min-height:18px;line-height:1.7}footer{text-align:center;font-size:10px;letter-spacing:1px;color:#80768e;padding:20px 20px 28px}footer span{color:#b49b70;margin:0 8px}@media(min-width:1000px){.card-wrap:nth-child(1),.card-wrap:nth-child(6){padding-top:19px}.card-wrap:nth-child(2),.card-wrap:nth-child(5){padding-top:6px}}@media(max-width:900px){main{max-width:700px;padding-top:35px}.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 18px}.card{aspect-ratio:.68}.front .message{font-size:13px}.front .symbol{margin-bottom:12px}}@media(max-width:480px){header{padding:19px 21px}.brand{font-size:14px}.header-note{font-size:9px;letter-spacing:1px}main{padding:31px 21px 20px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:21px 17px}.card{aspect-ratio:.68}.intro{font-size:12px}h1{letter-spacing:-1px}.eyebrow{font-size:9px}.divider{margin:22px 0}.front .message{font-size:12px}.front h2{font-size:19px}.front .symbol{font-size:33px}.number{margin-top:10px}.moon{font-size:28px}}@media(prefers-reduced-motion:reduce){.inner{transition:none}}
</style>
</head>
<body>
<header><div class="brand"><span aria-hidden="true">✧</span>별빛 한 장</div><div class="header-note">A LITTLE LIGHT FOR YOU</div></header>
<main><p class="eyebrow">A MOMENT JUST FOR YOURSELF</p><span class="moon" aria-hidden="true">☾</span><h1>지금, 마음이 머무는 <em>한 장.</em></h1><p class="intro">잠시 숨을 고르고, 끌리는 카드를 골라보세요.<br>카드 뒷면에 당신을 위한 작은 문장이 기다리고 있어요.</p><div class="divider" aria-hidden="true">✦</div>
<section class="cards" id="cards" aria-label="여섯 장의 글귀 카드"></section>
<div class="controls"><button type="button" class="shuffle" id="shuffle">↻ &nbsp; 카드를 다시 섞기</button><p class="hint" id="status" aria-live="polite" aria-atomic="true">정답은 없어요. 그저 마음이 가는 대로 골라주세요.</p></div>
<noscript><p>카드를 뒤집으려면 브라우저의 JavaScript를 켜주세요.</p></noscript></main>
<footer>별빛 한 장 <span>✦</span> 당신의 하루에 작은 빛이 되기를</footer>
<script>
// 카드의 제목과 글귀는 아래 목록에서 수정할 수 있습니다.
const messages = [
{title:'별',en:'THE STAR',symbol:'✧',text:"아직 닿지 않았을 뿐,\n당신의 빛은 사라지지 않았어요.\n오늘의 작은 걸음도\n분명 어딘가로 이어지고 있어요."},
{title:'달',en:'THE MOON',symbol:'☾',text:"모든 마음에\n이름을 붙이지 않아도 괜찮아요.\n오늘은 답을 찾기보다\n내 마음을 가만히 들어주세요."},
{title:'태양',en:'THE SUN',symbol:'☼',text:"기쁜 순간을\n나중으로 미루지 말아요.\n작은 웃음 하나만으로도\n오늘은 충분히 좋은 날이에요."},
{title:'세계',en:'THE WORLD',symbol:'◎',text:"여기까지 온 당신에게\n잘해왔다고 말해주세요.\n끝이라고 생각한 자리에서\n또 다른 풍경이 시작돼요."},
{title:'힘',en:'STRENGTH',symbol:'♧',text:"부드러운 마음으로도\n단단하게 나아갈 수 있어요.\n조금 쉬어가는 시간도\n당신을 지탱하는 힘이에요."},
{title:'새로운 길',en:'A NEW BEGINNING',symbol:'✦',text:"처음부터 멀리 볼 필요 없어요.\n마음이 향하는 쪽으로\n한 걸음만 내디뎌보세요.\n당신의 속도로 가도 괜찮아요."},
{title:'쉼',en:'A QUIET MOMENT',symbol:'❋',text:"아무것도 증명하지 않아도\n괜찮은 순간이 필요해요.\n오늘의 당신에게\n편히 쉴 자리를 내어주세요."},
{title:'인연',en:'CONNECTION',symbol:'♡',text:"당연하게 곁에 있는 마음도\n사실은 참 귀한 선물이에요.\n떠오르는 사람에게\n따뜻한 한마디를 건네보세요."},
{title:'가능성',en:'POSSIBILITY',symbol:'❈',text:"아직 펼쳐보지 않은\n당신의 페이지가 남아 있어요.\n작은 호기심이 데려갈 곳을\n조금은 기대해도 좋아요."},
{title:'평온',en:'SERENITY',symbol:'☽',text:"오늘 다 해결하지 않아도 돼요.\n잠시 어깨의 힘을 빼고\n천천히 숨을 쉬어보세요.\n지금 이 순간은 당신의 것이에요."},
{title:'용기',en:'COURAGE',symbol:'◇',text:"떨리는 마음을 안고도\n한 걸음 나아갈 수 있어요.\n작은 시작을 선택한 당신을\n마음껏 응원해주세요."},
{title:'꽃피움',en:'IN BLOOM',symbol:'✿',text:"꽃마다 피어나는 때가 다르듯\n당신에게도 당신의 계절이 있어요.\n다른 누군가의 시계에\n마음을 서두르지 말아요."}
];
const ornament = '<svg viewBox="0 0 160 265" fill="none" aria-hidden="true"><rect x="7" y="7" width="146" height="251" rx="60" stroke="currentColor" opacity=".35"/><path d="M80 22L86 34L80 46L74 34Z M80 219L86 231L80 243L74 231Z" stroke="currentColor"/><circle cx="80" cy="132" r="43" stroke="currentColor" opacity=".55"/><circle cx="80" cy="132" r="54" stroke="currentColor" stroke-dasharray="1 7" opacity=".6"/><path d="M80 75V94M80 170V189M23 132H42M118 132H137M40 92L53 105M107 159L120 172M40 172L53 159M107 105L120 92" stroke="currentColor" opacity=".5"/><path d="M80 105L86 126L107 132L86 138L80 159L74 138L53 132L74 126Z" stroke="currentColor"/><circle cx="80" cy="132" r="9" stroke="currentColor"/><path d="M43 56L46 63L53 66L46 69L43 76L40 69L33 66L40 63Z M117 189L120 196L127 199L120 202L117 209L114 202L107 199L114 196Z" stroke="currentColor" opacity=".65"/><circle cx="118" cy="66" r="2" fill="currentColor"/><circle cx="42" cy="199" r="2" fill="currentColor"/></svg>';
const deck=document.getElementById('cards');
const status=document.getElementById('status');
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deal(){deck.replaceChildren();shuffle(messages).slice(0,6).forEach((message,i)=>{const wrap=document.createElement('div');wrap.className='card-wrap';const card=document.createElement('button');card.type='button';card.className='card';card.setAttribute('aria-label',(i+1)+'번째 카드 뒤집기');card.setAttribute('aria-pressed','false');card.innerHTML='<span class="inner"><span class="face back">'+ornament+'</span><span class="face front" aria-hidden="true"><span class="symbol">'+message.symbol+'</span><span class="english">'+message.en+'</span><h2>'+message.title+'</h2><span class="message">'+message.text.replaceAll('\n','<br>')+'</span><span class="tiny">✦</span></span></span>';card.addEventListener('click',()=>{const open=card.classList.toggle('flipped');card.setAttribute('aria-pressed',String(open));card.querySelector('.front').setAttribute('aria-hidden',String(!open));card.setAttribute('aria-label',open?message.title+'. '+message.text.replaceAll('\n',' ')+' 다시 누르면 카드를 덮습니다.':(i+1)+'번째 카드 뒤집기');status.textContent=open?'당신이 고른 문장 · '+message.title+' — 마음에 남는 만큼 천천히 읽어주세요.':'다른 카드에도 작은 문장이 기다리고 있어요.'});const number=document.createElement('span');number.className='number';number.textContent=['I','II','III','IV','V','VI'][i];wrap.append(card,number);deck.append(wrap)});}
document.getElementById('shuffle').addEventListener('click',()=>{deal();status.textContent='카드를 새로 섞었어요. 다시 마음이 가는 한 장을 골라보세요.'});deal();
</script>
</body>
</html>
